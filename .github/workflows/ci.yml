# Runs on every push to main and every pull request: lint and test the back end.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real PostgreSQL next to the job, so tests run against the same database as production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: replydesk
          POSTGRES_PASSWORD: replydesk
          POSTGRES_DB: replydesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replydesk"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://replydesk:replydesk@localhost:5432/replydesk
      TEST_DATABASE_URL: postgresql+psycopg://replydesk:replydesk@localhost:5432/replydesk_test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations apply and match the models
        run: alembic upgrade head && alembic check
      - name: Test
        # conftest.py points the app at TEST_DATABASE_URL, never DATABASE_URL
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    # Two browser tests against the whole stack in Docker, with the fake model (no AI calls).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright tests
        run: sh frontend/e2e/run.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
