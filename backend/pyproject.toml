# Tool settings only. Dependencies live in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
# E/W: style errors, F: likely bugs (unused imports, undefined names),
# I: import order, B: common pitfalls, UP: modern Python syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
