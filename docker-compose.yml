# Local development: the web front end, the API and a PostgreSQL database: `docker compose up`.
# Values come from .env (copy .env.example); the defaults after ":-" are used if .env is missing.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-replydesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replydesk}
      POSTGRES_DB: ${POSTGRES_DB:-replydesk}
    ports:
      # Host port 5442 (not 5432) so it does not clash with other local Postgres servers.
      - "${DB_PORT:-5442}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-replydesk}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .  # the repo root, so the image can include agents/*.md
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: local
      AGENT_CLIENT: ${AGENT_CLIENT:-llm}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-please}
      # The browser page that may call this API (the web service below).
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3010}
      # Inside Compose the database's host name is the service name "db".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-replydesk}:${POSTGRES_PASSWORD:-replydesk}@db:5432/${POSTGRES_DB:-replydesk}
    ports:
      # Open the API on the host at port 8010 (inside the container it listens on 8000).
      - "${API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./frontend
      args:
        # The address the *browser* uses to reach the API (baked in at build time).
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8010}
    ports:
      - "${WEB_PORT:-3010}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db_data:
